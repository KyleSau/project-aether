[package]
name = "aether-wasm"
version = "0.1.0"
edition = "2021"
description = "Project Aether real-time 6-DOF ascent integrator (port of physics/aether_physics/dynamics.py)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.116"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
